name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Odin nightly ovg is developed against (same pin as onimite).
  ODIN_VERSION: dev-2026-10

# ovg imports no sibling repositories. The core package and the software
# backend are tested; the SDL_GPU backend (sdlgpu/) is type-checked only,
# since hosted runners have no GPU and `odin check` needs no SDL3 library.

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Odin
        id: odin-cache
        uses: actions/cache@v4
        with:
          path: ~/.odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ env.ODIN_VERSION }}-v1

      - name: Install Odin
        if: steps.odin-cache.outputs.cache-hit != 'true'
        run: |
          case "$RUNNER_OS" in
            Linux) asset="odin-linux-amd64-$ODIN_VERSION.tar.gz" ;;
            macOS) asset="odin-macos-arm64-$ODIN_VERSION.tar.gz" ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/odin.tar.gz" \
            "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/$asset"
          mkdir -p ~/.odin
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C ~/.odin --strip-components=1
          # vendor:kb_text_shape (and vendor:stb on Linux; macOS ships it
          # prebuilt) come as C source. ODIN_ROOT tells the scripts where.
          export ODIN_ROOT="$HOME/.odin"
          if [ "$RUNNER_OS" = Linux ]; then sh "$ODIN_ROOT/vendor/stb/src/build_stb.sh" unix; fi
          sh "$ODIN_ROOT/vendor/kb_text_shape/src/build_unix.sh"

      - name: Set up Odin
        run: |
          echo "$HOME/.odin" >> "$GITHUB_PATH"
          echo "ODIN_ROOT=$HOME/.odin" >> "$GITHUB_ENV"

      - name: Install test fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          # text_shape_test.odin shapes with system Noto fonts (Serif, Sans,
          # Sans Arabic) and skips those cases when they are missing, as on macOS.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-core

      - name: Test
        run: |
          mkdir -p build
          odin test . -vet -strict-style -out:build/ovg_test
          odin test curves -vet -strict-style -out:build/curves_test

      - name: SVG and Lottie suites (Linux)
        # Renders vs resvg and lottie-web references; run.sh uses GNU timeout.
        if: runner.os == 'Linux'
        run: |
          bash tools/svg_suite/run.sh
          bash tools/lottie_suite/run.sh

      - name: Check the SDL_GPU backend
        run: |
          odin check sdlgpu -no-entry-point -vet -strict-style
          # The other desktop target's compile (Windows needs an SDK to check).
          if [ "$RUNNER_OS" = Linux ]; then
            odin check sdlgpu -no-entry-point -target:darwin_arm64
          fi
