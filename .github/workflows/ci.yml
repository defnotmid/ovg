name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Odin nightly ovg is developed against (same pin as onimite).
  ODIN_VERSION: dev-2026-10

# ovg reads oglyph (fonts and shaping), ocurves (shapes' coverage and path
# booleans) and odecs (image decoding and PNG writing) through
# `-collection:deps=..`, so the job checks them out side by side:
#   $GITHUB_WORKSPACE/{ovg,oglyph,ocurves,odecs}
# All are pinned to the tags onimite builds with. The core package with the
# software backend, svg and lottie are tested; the SDL_GPU backend
# (sdlgpu/) is type-checked only, since hosted runners have no GPU and
# `odin check` needs no SDL3 library.

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ovg
    steps:
      - uses: actions/checkout@v4
        with:
          path: ovg
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/oglyph
          ref: v0.0.12
          path: oglyph
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/ocurves
          ref: v0.0.6
          path: ocurves
      - uses: actions/checkout@v4
        with:
          repository: defnotmid/odecs
          ref: v0.0.8
          path: odecs

      - name: Cache Odin
        id: odin-cache
        uses: actions/cache@v4
        with:
          path: ~/.odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ env.ODIN_VERSION }}-v1

      - name: Install Odin
        if: steps.odin-cache.outputs.cache-hit != 'true'
        run: |
          case "$RUNNER_OS" in
            Linux) asset="odin-linux-amd64-$ODIN_VERSION.tar.gz" ;;
            macOS) asset="odin-macos-arm64-$ODIN_VERSION.tar.gz" ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/odin.tar.gz" \
            "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/$asset"
          mkdir -p ~/.odin
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C ~/.odin --strip-components=1

      - name: Set up Odin
        run: |
          echo "$HOME/.odin" >> "$GITHUB_PATH"
          echo "ODIN_ROOT=$HOME/.odin" >> "$GITHUB_ENV"

      - name: Install test fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          # text_shape_test.odin shapes with system Noto fonts (Serif, Sans,
          # Sans Arabic) and skips those cases when they are missing, as on macOS.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-core

      - name: Test
        run: |
          mkdir -p build
          odin test . -collection:deps=.. -vet -strict-style -out:build/ovg_test
          odin test svg -collection:deps=.. -vet -strict-style -out:build/svg_test
          odin test lottie -collection:deps=.. -vet -strict-style -out:build/lottie_test

      - name: SVG and Lottie suites (Linux)
        # Renders vs resvg and lottie-web references; run.sh uses GNU timeout.
        if: runner.os == 'Linux'
        run: |
          bash tools/svg_suite/run.sh
          bash tools/lottie_suite/run.sh

      - name: Check the SDL_GPU backend
        run: |
          odin check sdlgpu -collection:deps=.. -no-entry-point -vet -strict-style
          # The other desktop target's compile (Windows needs an SDK to check).
          if [ "$RUNNER_OS" = Linux ]; then
            odin check sdlgpu -collection:deps=.. -no-entry-point -target:darwin_arm64
          fi
